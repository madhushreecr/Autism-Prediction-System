<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Autism Detection System{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
</head>
<body>
  <nav class="nav">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-logo">A</span>
      <span>NeuroScan AI</span>
    </a>
    <div class="nav-links">
      <a href="{{ url_for('index') }}">Home</a>
      <a href="{{ url_for('index') }}#predict">Predict</a>
      <a href="{{ url_for('about') }}">About</a>
      <button class="theme-toggle" data-theme-toggle>🌙 Dark</button>
    </div>
  </nav>

  {% block body %}{% endblock %}

  <div class="loader-overlay" id="loader"><div class="spinner"></div></div>

  <footer>
    © {{ 2025 }} NeuroScan AI · Educational ML screening tool — not a medical diagnosis.
  </footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
